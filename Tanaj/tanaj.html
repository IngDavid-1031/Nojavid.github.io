<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORAH</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="styles/tanaj-styles.css">
    
    <!-- CSS específico para PC (oculta todo y muestra mantenimiento) -->
    <link rel="stylesheet" href="styles/tanaj-styles-pc.css" media="screen and (min-width: 769px)">
    
    <!-- CSS específico para móviles -->
    <link rel="stylesheet" href="styles/tanaj-styles-movil.css" media="screen and (max-width: 768px)">
</head>
<body>

    <!-- ========================================== -->
    <!-- PANTALLA DE MANTENIMIENTO (SOLO PC)       -->
    <!-- ========================================== -->
    <div id="pantalla-mantenimiento">
        <div class="icono-mantenimiento">🛠️</div>
        <h1>Mantenimiento no disponible</h1>
        <p>La versión de escritorio se encuentra en mantenimiento. Por favor, utiliza tu dispositivo móvil para acceder al contenido.</p>
        
        <div class="spinner-container">
            <div class="spinner spinner-large"></div>
        </div>
        
        <div class="barra-progreso">
            <div class="barra-llena"></div>
        </div>
        
        <div class="estado-mantenimiento">⚡ Actualizando sistema ⚡</div>
        
        <div class="nota-pie">Tanaj Digital • Versión 2.0</div>
    </div>

    <!-- ========================================== -->
    <!-- CONTENEDOR PRINCIPAL (SOLO MÓVIL)         -->
    <!-- ========================================== -->
    <div id="contenedor-principal">
        <!-- EL CONTENIDO SE GENERA CON JAVASCRIPT -->
    </div>

    <!-- ========================================== -->
    <!-- MENÚ LATERAL (SOLO MÓVIL)                 -->
    <!-- ========================================== -->
    <div id="menu-lateral" class="menu-cerrado">
        <div class="menu-header">
            <h3>📚 Libros del Tanaj</h3>
            <button id="btn-cerrar-menu" aria-label="Cerrar menú">✕</button>
        </div>
        <ul id="lista-libros-menu">
            <!-- Generado por JavaScript desde tanaj.json -->
        </ul>
    </div>

    <!-- Overlay para cerrar el menú -->
    <div id="overlay-menu"></div>

    <script src="../Tanaj/tanajScript.js"></script>

</body>
</html>
